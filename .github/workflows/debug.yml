name: Compile Debug

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cook Variables from gradle.properties
        run: |
          id=$(grep '^extId=' gradle.properties | cut -d'=' -f2)
          version=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "APP_PATH=app/build/${id}-debug-${version}.eapk" >> $GITHUB_ENV

      - name: Build debug (no signing secrets needed)
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "${{ env.APP_PATH }}"

      - name: Upload eapk
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.APP_PATH }}
